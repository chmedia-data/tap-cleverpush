# Fails when .github/workflows/actions.lock is out of sync with the
# workflows, or a locked action no longer verifies upstream. Fix it locally
# with `gh actions-lock` and commit the result (DATA-3896).
name: verify-lockfile

on:
  pull_request:
  push:
    branches: [ 'master' ]

permissions:
  contents: read

jobs:
  verify:
    # GitHub-hosted on purpose: the check needs no AWS access, so it stays off
    # the CodeBuild runners and their role
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      # not an action, so neither the lockfile nor Dependabot covers this pin;
      # bump it by hand
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify the lockfile
        run: gh actions-lock --verify
